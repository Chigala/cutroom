# Lint (once), typecheck and tests. A pull request runs on Windows and Linux; what's merged to main runs
# on all three, macOS too. GitHub counts a macOS minute as ten and a Windows minute as two, so macOS on
# every push of every pull request is most of what the month's included minutes would buy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-2022","ubuntu-22.04"]' || '["macos-14","windows-2022","ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Several tests run ffmpeg.
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Lint
        if: runner.os == 'Linux'
        run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
