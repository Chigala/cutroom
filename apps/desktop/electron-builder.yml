appId: dev.durableagent.cutroom
productName: Cutroom
directories:
  output: release
files:
  - dist/**
  - package.json
  # Not the workspace's dependency tree (electron-builder collects it by default): only what's staged below.
  - "!node_modules/**"
  # What the main bundle leaves out (scripts/runtime-deps.mjs): Remotion's renderer, the Agent SDK, zod.
  # Their native programs ship beside the archive instead (extraResources below): they can't run from it.
  - from: .tmp/runtime/node_modules
    to: node_modules
    filter:
      - "**/*"
      - "!@remotion/compositor-*/**"
      - "!@anthropic-ai/claude-agent-sdk-*/**"
asar: true
# ONNX Runtime's native library loads from disk, not from inside the archive.
asarUnpack:
  - "**/onnxruntime-node/bin/**"
# Nothing to rebuild: the app has no native Node modules of its own.
npmRebuild: false
mac:
  # The app icon (build/icon.svg is the source; icon.icns is drawn on Apple's grid from icon-mac.svg).
  icon: build/icon.icns
  category: public.app-category.video
  # The bundled whisper uses Accelerate calls from macOS 13.3.
  minimumSystemVersion: "13.3"
  # ffmpeg, ffprobe, whisper, the voice cleaner and the sound classifier (made by `pnpm tools`).
  extraResources:
    - from: resources/tools/darwin-${arch}
      to: tools
    # The starter pack of public-domain sounds and music (src/main/starter-pack.ts).
    - from: resources/starter-library
      to: starter-library
    # Remotion's compositor and Claude Code (the Agent SDK's binary), found via VEDIT_REMOTION_BIN and
    # VEDIT_CLAUDE_BIN (src/main/index.ts).
    - from: .tmp/runtime/node_modules/@remotion/compositor-darwin-${arch}
      to: native/remotion-compositor
    - from: .tmp/runtime/node_modules/@anthropic-ai/claude-agent-sdk-darwin-${arch}
      to: native/claude-agent-sdk
  target: [dmg]
  hardenedRuntime: true
win:
  icon: build/icon.png
  # ffmpeg, ffprobe, whisper and the voice cleaner (made by `pnpm tools` on Windows), the compositor and
  # Claude Code, as on macOS.
  extraResources:
    - from: resources/tools/win32-${arch}
      to: tools
    # The starter pack of public-domain sounds and music (src/main/starter-pack.ts).
    - from: resources/starter-library
      to: starter-library
    - from: .tmp/runtime/node_modules/@remotion/compositor-win32-${arch}-msvc
      to: native/remotion-compositor
    - from: .tmp/runtime/node_modules/@anthropic-ai/claude-agent-sdk-win32-${arch}
      to: native/claude-agent-sdk
  target: [nsis]
nsis:
  # A normal installer: the user picks where it goes, and it installs for them alone (no admin prompt).
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
linux:
  icon: build/icon.png
  executableName: cutroom
  category: AudioVideo
  # The same, made by `pnpm tools` on Linux. glibc builds of the compositor and Claude Code.
  extraResources:
    - from: resources/tools/linux-${arch}
      to: tools
    # The starter pack of public-domain sounds and music (src/main/starter-pack.ts).
    - from: resources/starter-library
      to: starter-library
    - from: .tmp/runtime/node_modules/@remotion/compositor-linux-${arch}-gnu
      to: native/remotion-compositor
    - from: .tmp/runtime/node_modules/@anthropic-ai/claude-agent-sdk-linux-${arch}
      to: native/claude-agent-sdk
  target: [AppImage, deb]
  # The .deb needs a maintainer (its package metadata); no email is published.
  maintainer: Cutroom
deb:
  # Ubuntu 24.04 renamed several libraries (the t64 transition): accept either name.
  depends:
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64 | libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1
    # The C++ runtime the bundled ffmpeg links.
    - libstdc++6
    - libgcc-s1
