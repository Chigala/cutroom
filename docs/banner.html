<!doctype html>
<!-- The README banner (docs/banner.png). Render it at 2x:
  chrome --headless=new --hide-scrollbars --force-device-scale-factor=2 --window-size=1280,560 --screenshot=docs/banner.png docs/banner.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #141413; --panel: #1a1a19; --card: #1e1e1d; --line: #272726; --line-strong: #31312f;
    --fg: #eeede9; --muted: #a3a29b; --faint: #777670; --accent: #f5a524;
    --display: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 560px; overflow: hidden; background: var(--bg); }
  body { position: relative; font-family: var(--display); color: var(--fg); -webkit-font-smoothing: antialiased; }

  /* A faint grid, fading out toward the text. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse 70% 90% at 75% 50%, #000 30%, transparent 75%);
  }
  .glow {
    position: absolute; width: 520px; height: 520px; left: 860px; top: 40px; border-radius: 50%;
    background: radial-gradient(circle, rgba(245,165,36,0.30), rgba(245,165,36,0.08) 45%, transparent 70%);
    filter: blur(10px);
  }

  .left { position: absolute; left: 72px; top: 64px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 27px; font-weight: 600; letter-spacing: -0.02em; }
  .brand img { width: 46px; height: 46px; border-radius: 11px; box-shadow: 0 0 0 1px var(--line-strong); }
  h1 {
    margin-top: 44px; font-size: 80px; line-height: 0.98; font-weight: 650; letter-spacing: -0.04em;
  }
  h1 .accent { color: var(--accent); }
  .sub { margin-top: 26px; font-size: 21px; line-height: 1.45; color: var(--muted); letter-spacing: -0.005em; max-width: 560px; }
  .chips { margin-top: 34px; display: flex; gap: 10px; }
  .chip {
    display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 15px; border-radius: 999px;
    border: 1px solid var(--line-strong); background: rgba(30,30,29,0.8);
    font-family: var(--mono); font-size: 13px; color: var(--muted); letter-spacing: 0.01em;
  }
  .chip.on { color: var(--fg); border-color: rgba(245,165,36,0.45); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }

  /* The phones: what you shot, the playhead, the edit. */
  .phone {
    position: absolute; width: 214px; height: 406px; border-radius: 30px; overflow: hidden;
    background: #000; box-shadow: 0 30px 70px -20px rgba(0,0,0,0.85);
  }
  .phone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shot { left: 790px; top: 96px; transform: rotate(-4deg); border: 1.5px solid rgba(255,255,255,0.10); filter: saturate(0.9); }
  .edit { left: 1018px; top: 70px; transform: rotate(3deg); border: 2px solid var(--accent); box-shadow: 0 30px 80px -20px rgba(0,0,0,0.9), 0 0 60px -10px rgba(245,165,36,0.45); }
  .edit .city { filter: saturate(1.15) contrast(1.05); }
  .edit .person { object-fit: cover; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 74px; text-align: center;
    font-size: 21px; font-weight: 800; letter-spacing: -0.01em; color: #fff; padding: 0 16px; text-transform: uppercase;
    text-shadow: 0 3px 14px rgba(0,0,0,0.7);
  }
  .caption em { font-style: normal; color: var(--accent); }

  .playhead { position: absolute; left: 1002px; top: 54px; width: 3px; height: 452px; background: var(--accent); border-radius: 2px; box-shadow: 0 0 18px rgba(245,165,36,0.7); }
  .playhead::before {
    content: ""; position: absolute; left: -9px; top: -14px; width: 21px; height: 18px; background: var(--accent);
    clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%);
  }

  .ask {
    position: absolute; left: 744px; top: 58px; padding: 11px 15px 12px; border-radius: 16px 16px 16px 5px;
    background: var(--card); border: 1px solid var(--line-strong); box-shadow: 0 18px 40px -12px rgba(0,0,0,0.8);
    font-size: 15.5px; color: var(--fg); letter-spacing: -0.005em; transform: rotate(-4deg);
  }
  .ask small { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--faint); letter-spacing: 0.08em; margin-bottom: 4px; }

  .label { position: absolute; top: 522px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; color: var(--faint); }
  .label.edited { color: var(--accent); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="left">
    <div class="brand"><img src="../apps/site/public/icon-512.png" alt="">Cutroom</div>
    <h1>You direct.<br>The agent <span class="accent">edits.</span></h1>
    <p class="sub">The open-source, AI-native video editor. It sees every frame and hears every word, so you just ask.</p>
    <div class="chips">
      <span class="chip on"><span class="dot"></span>Open source</span>
      <span class="chip">Claude Code · Codex</span>
      <span class="chip">macOS · Windows · Linux</span>
    </div>
  </div>

  <div class="phone shot"><img src="../apps/site/public/demo/before.jpg" alt=""></div>
  <div class="ask"><small>YOU</small>Put me in Tokyo, at night.</div>
  <div class="playhead"></div>
  <div class="phone edit">
    <img class="city" src="../apps/site/public/demo/tokyo.jpg" alt="">
    <img class="person" src="../apps/site/public/demo/cutout.webp" alt="">
    <div class="caption">Tokyo <em>at night</em></div>
  </div>
  <div class="label" style="left: 836px">WHAT YOU SHOT</div>
  <div class="label edited" style="left: 1086px">EDITED</div>
</body>
</html>
